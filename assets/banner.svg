<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181030"/>
      <stop offset="50%" stop-color="#2d1b69"/>
      <stop offset="100%" stop-color="#1a0a3e"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle cx="600" cy="150" r="260" fill="url(#glow)"/>
  <!-- scattered stars -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="80" cy="50" r="1.5"/><circle cx="140" cy="90" r="1"/><circle cx="60" cy="200" r="1.5"/>
    <circle cx="1120" cy="60" r="1.5"/><circle cx="1080" cy="220" r="1"/><circle cx="1150" cy="140" r="1.5"/>
    <circle cx="200" cy="250" r="1"/><circle cx="1000" cy="40" r="1"/><circle cx="950" cy="260" r="1.5"/>
    <circle cx="300" cy="30" r="1"/><circle cx="900" cy="100" r="1"/><circle cx="100" cy="140" r="1"/>
  </g>
  <!-- lamp emoji-style icon -->
  <text x="185" y="185" font-size="90" text-anchor="middle">🪔</text>
  <!-- title -->
  <text x="640" y="150" font-family="Verdana, Arial, sans-serif" font-size="72" font-weight="900" fill="url(#title)" text-anchor="middle">SpeakGenie</text>
  <text x="640" y="195" font-family="Verdana, Arial, sans-serif" font-size="22" font-weight="700" fill="#c4b5fd" text-anchor="middle">AI English Learning App for Kids · Games · AI Calls · Comics · Sync</text>

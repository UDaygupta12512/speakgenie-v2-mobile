<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Access Denied — SpeakGenie</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0a0618;--card:rgba(255,255,255,.07);--bd:rgba(255,255,255,.11);--sub:rgba(255,255,255,.48);}
body{font-family:'Nunito',sans-serif;background:#181030;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;}
.wrap{width:100%;max-width:400px;background:var(--bg);border-radius:32px;border:2px solid rgba(255,255,255,.13);box-shadow:0 0 70px rgba(124,58,237,.3),0 36px 72px rgba(0,0,0,.6);padding:40px 28px;text-align:center;position:relative;overflow:hidden;}
.stars{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.star{position:absolute;border-radius:50%;background:#fff;animation:tw var(--d,3s) var(--dl,0s) infinite;}
@keyframes tw{0%,100%{opacity:.07;}50%{opacity:.85;}}
@keyframes fl{0%,100%{transform:translateY(0) rotate(0);}50%{transform:translateY(-10px) rotate(-3deg);}}
@keyframes pulseR{0%,100%{box-shadow:0 0 0 0 rgba(124,58,237,.5);}50%{box-shadow:0 0 0 14px rgba(124,58,237,0);}}
.logo{font-family:'Fredoka One',cursive;font-size:22px;background:linear-gradient(135deg,#fde68a,#f97316,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:24px;display:inline-flex;align-items:center;gap:7px;position:relative;z-index:2;}
.mascot{font-size:80px;margin:10px 0 18px;animation:fl 3s ease-in-out infinite;position:relative;z-index:2;filter:drop-shadow(0 8px 20px rgba(0,0,0,.4));}
.code{font-family:'Bangers',cursive;font-size:52px;letter-spacing:3px;background:linear-gradient(135deg,#a78bfa,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;position:relative;z-index:2;}
h1{color:#fff;font-size:19px;font-weight:900;margin-bottom:10px;position:relative;z-index:2;}
p{color:var(--sub);font-size:13px;font-weight:600;line-height:1.65;margin-bottom:26px;position:relative;z-index:2;}
.btns{display:flex;gap:10px;position:relative;z-index:2;}
.btn{flex:1;border:none;border-radius:14px;padding:13px;font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .15s;}
.btn:active{transform:scale(.96);}
.bpr{background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;}
.bgh{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.18);color:#fff;}
.helper{margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.35);font-size:11px;font-weight:700;position:relative;z-index:2;}
.badge{display:inline-flex;align-items:center;gap:5px;background:rgba(255,165,0,.13);border:1px solid rgba(255,165,0,.32);border-radius:18px;padding:4px 13px;color:#fbbf24;font-size:10.5px;font-weight:800;margin-bottom:16px;position:relative;z-index:2;}
</style>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">

</head>
<body>
<div class="wrap">
  <div class="stars"></div>
  <div class="logo"><span style="font-size:22px;">🪔</span>SpeakGenie</div>
  <div class="badge">NOT FOR YOU 🚫</div>
  <div class="mascot">🦁🛑</div>
  <div class="code">403</div>
  <h1>This area is off-limits!</h1>
  <p>Simba is guarding this page and you don't have permission to enter. If you think this is a mistake, ask a parent to check your account settings.</p>
  <div class="btns">
    <a class="btn bpr" href="index.html">🏠 Go Home</a>
    <a class="btn bgh" href="mailto:support@speakgenie.app">✉️ Contact Support</a>
  </div>
  <div class="helper">Need help? Ask a parent or teacher, or try again in a moment.</div>
</div>
<script>
document.querySelectorAll('.stars').forEach(el=>{for(let i=0;i<20;i++){const s=document.createElement('div');s.className='star';const sz=1+Math.random()*2;s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${(2+Math.random()*4).toFixed(1)}s;--dl:${(Math.random()*4).toFixed(1)}s;`;el.appendChild(s);}});
</script>
</body>
</html>
